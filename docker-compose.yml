# ExoBrain v2: SQLite-backed personal knowledge system
#
# Core services: exobrain (CLI + API)
# Optional profiles:
#   - test: Isolated test instance (separate data dir, port 8421)
#   - graphrag: Ollama, Gephi Lite, watcher
#   - docker: Docker-based Ollama (CPU only; native recommended)

services:
  exobrain:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: exobrain
    ports:
      - "127.0.0.1:${EXOBRAIN_API_PORT:-8420}:8420"
    environment:
      - EXOBRAIN_DATA_DIR=/data
      - EXOBRAIN_CACHE_DIR=/cache
      - EXOBRAIN_USER=${EXOBRAIN_USER:-Unknown}
      - EXOBRAIN_USER_EMAIL=${EXOBRAIN_USER_EMAIL:-}
      - EXOBRAIN_OLLAMA_MODE=${OLLAMA_MODE:-native}
    volumes:
      # Canonical data (Dropbox-synced): DB, files, legacy raw/overlays
      - ${EXOBRAIN_DATA_DIR}:/data
      # Derived data (container-local): staged, graphrag, logs
      - exobrain_cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: ["python", "-m", "src.api.main"]

  # Isolated test instance (only starts with --profile test)
  exobrain-test:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: exobrain-test
    profiles:
      - test
    ports:
      - "127.0.0.1:${EXOBRAIN_TEST_API_PORT:-8421}:8420"
    environment:
      - EXOBRAIN_DATA_DIR=/data
      - EXOBRAIN_CACHE_DIR=/cache
      - EXOBRAIN_USER=Test User
      - EXOBRAIN_USER_EMAIL=test@example.com
      - EXOBRAIN_OLLAMA_MODE=${OLLAMA_MODE:-native}
    volumes:
      - ${EXOBRAIN_TEST_DATA_DIR:-./test-data}:/data
      - exobrain_test_cache:/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: "no"
    command: ["python", "-m", "src.api.main"]

  # File watcher (optional; GraphRAG profile)
  watcher:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: exobrain-watcher
    profiles:
      - graphrag
    environment:
      - EXOBRAIN_DATA_DIR=/data
      - EXOBRAIN_CACHE_DIR=/cache
      - EXOBRAIN_OLLAMA_MODE=${OLLAMA_MODE:-native}
    volumes:
      - ${EXOBRAIN_DATA_DIR}:/data
      - exobrain_cache:/cache
    depends_on:
      - exobrain
    restart: unless-stopped
    command: ["python", "-m", "src.watcher.main"]

  # Docker-based Ollama (only starts with --profile docker)
  ollama:
    image: ollama/ollama:latest
    container_name: exobrain-ollama
    profiles:
      - docker
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_KV_CACHE_TYPE=fp16
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # Log viewer
  dozzle:
    image: amir20/dozzle:latest
    container_name: exobrain-dozzle
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-9998}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_FILTER=name=exobrain
    restart: unless-stopped

  # Graph visualization (optional; GraphRAG profile)
  gephi-lite:
    image: ouestware/gephi-lite
    container_name: exobrain-gephi
    profiles:
      - graphrag
    ports:
      - "127.0.0.1:${GEPHI_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  ollama_models:
  exobrain_cache:
  exobrain_test_cache:
