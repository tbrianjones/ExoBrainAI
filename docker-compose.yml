# Ollama mode: native (recommended) or docker
# Set OLLAMA_MODE in .env file
# - native: Ollama runs on host Mac with GPU acceleration (20-30x faster)
# - docker: Ollama runs in container on CPU only (for testing)

services:
  exobrain:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: exobrain
    ports:
      - "${EXOBRAIN_API_PORT:-8420}:8420"
    environment:
      - EXOBRAIN_DATA_DIR=/data
      - EXOBRAIN_CACHE_DIR=/cache
      - EXOBRAIN_USER=${EXOBRAIN_USER:-Unknown}
      - EXOBRAIN_USER_EMAIL=${EXOBRAIN_USER_EMAIL:-}
      # Ollama mode: native (GPU on host) or docker (CPU in container)
      - EXOBRAIN_OLLAMA_MODE=${OLLAMA_MODE:-native}
    volumes:
      # Canonical data (Dropbox-synced): raw docs and overlays
      - ${EXOBRAIN_DATA_DIR}:/data
      # Derived data (container-local): staged, graphrag, logs
      - exobrain_cache:/cache
      # Legacy ideas folder (read-only, for migration)
      - ./ideas:/ideas:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: ["python", "-m", "src.api.main"]

  watcher:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: exobrain-watcher
    environment:
      - EXOBRAIN_DATA_DIR=/data
      - EXOBRAIN_CACHE_DIR=/cache
      - EXOBRAIN_OLLAMA_MODE=${OLLAMA_MODE:-native}
    volumes:
      # Canonical data (Dropbox-synced): raw docs and overlays
      - ${EXOBRAIN_DATA_DIR}:/data
      # Derived data (container-local): staged, graphrag, logs
      - exobrain_cache:/cache
    depends_on:
      - exobrain
    restart: unless-stopped
    command: ["python", "-m", "src.watcher.main"]

  # Docker-based Ollama (only starts with --profile docker)
  # Use: docker compose --profile docker up
  ollama:
    image: ollama/ollama:latest
    container_name: exobrain-ollama
    profiles:
      - docker
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # GraphRAG requires large context for community_reports (8K+ input)
      # IMPORTANT: Docker Desktop must have 12GB+ RAM allocated
      - OLLAMA_CONTEXT_LENGTH=8192
      # Use fp16 for faster generation on Apple Silicon
      - OLLAMA_KV_CACHE_TYPE=fp16
      # Give model more time to load
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      # Basic check that Ollama is responding; model pull happens via init command
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: exobrain-dozzle
    ports:
      - "${DOZZLE_PORT:-9998}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_FILTER=name=exobrain
    restart: unless-stopped

  gephi-lite:
    image: ouestware/gephi-lite
    container_name: exobrain-gephi
    ports:
      - "${GEPHI_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  ollama_models:
  exobrain_cache:
    # Container-local volume for derived/regenerable data
    # Can be safely deleted; will rebuild on next index
