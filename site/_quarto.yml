project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!CLAUDE.md"
    - "!README.md"

website:
  title: "T. Brian Jones"
  description: "Writing, code, and interactive explorations"
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/tbrianjones
  page-footer:
    center: "Built with Quarto"

format:
  html:
    theme:
      - sandstone
      - theme.scss
    toc: true
    code-fold: true
    code-tools: true
