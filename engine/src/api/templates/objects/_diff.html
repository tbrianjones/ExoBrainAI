{% if diffs %}
<div class="p-3 space-y-3">
    <div class="text-xs text-gray-500 mb-2">Changes from v{{ from_version }} to v{{ to_version }}</div>
    {% for d in diffs %}
    <div>
        <div class="text-xs font-medium text-gray-600 uppercase tracking-wider mb-1">{{ d.field }}</div>
        <pre class="text-xs font-mono overflow-x-auto bg-gray-50 rounded border border-gray-200 p-2">{{ d.diff_html | safe }}</pre>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="p-3">
    <p class="text-gray-400 text-sm">No content changes detected</p>
</div>
{% endif %}
