<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExoBrain{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="h-full" hx-headers='{"HX-Request": "true"}'>
    <div class="flex h-full">
        <!-- Sidebar -->
        <nav class="w-56 bg-gray-900 text-gray-300 flex flex-col flex-shrink-0">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-lg font-bold text-white tracking-tight">ExoBrain</h1>
                <p class="text-xs text-gray-500 mt-1">Knowledge Explorer</p>
            </div>
            <ul class="flex-1 py-2 space-y-0.5 text-sm">
                <li>
                    <a href="/ui/" class="flex items-center px-4 py-2 hover:bg-gray-800 hover:text-white {% if active_page == 'dashboard' %}bg-gray-800 text-white{% endif %}">
                        <span class="w-5 text-center mr-2 text-gray-500">&#9632;</span>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="/ui/objects" class="flex items-center px-4 py-2 hover:bg-gray-800 hover:text-white {% if active_page == 'objects' %}bg-gray-800 text-white{% endif %}">
                        <span class="w-5 text-center mr-2 text-gray-500">&#9671;</span>
                        Objects
                    </a>
                </li>
                <li>
                    <a href="/ui/files" class="flex items-center px-4 py-2 hover:bg-gray-800 hover:text-white {% if active_page == 'files' %}bg-gray-800 text-white{% endif %}">
                        <span class="w-5 text-center mr-2 text-gray-500">&#9783;</span>
                        Files
                    </a>
                </li>
                <li>
                    <a href="/ui/projection" class="flex items-center px-4 py-2 hover:bg-gray-800 hover:text-white {% if active_page == 'projection' %}bg-gray-800 text-white{% endif %}">
                        <span class="w-5 text-center mr-2 text-gray-500">&#9650;</span>
                        Projection
                    </a>
                </li>
                <li>
                    <a href="/ui/console" class="flex items-center px-4 py-2 hover:bg-gray-800 hover:text-white {% if active_page == 'console' %}bg-gray-800 text-white{% endif %}">
                        <span class="w-5 text-center mr-2 text-gray-500">&gt;_</span>
                        Console
                    </a>
                </li>
            </ul>
            <div class="p-4 border-t border-gray-700 text-xs text-gray-500">
                v{{ version }} &middot; Read-only
            </div>
        </nav>

        <!-- Main content -->
        <main class="flex-1 overflow-y-auto">
            <div class="p-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
