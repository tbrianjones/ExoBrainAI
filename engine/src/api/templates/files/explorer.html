{% extends "base.html" %}
{% block title %}Files ; ExoBrain{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-gray-900 mb-6">File Explorer</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- File storage pane -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-3">File Storage (files/)</h3>
        <div id="files-tree"
             hx-get="/ui-api/files/tree?root=files"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="text-gray-500 text-sm">Loading...</div>
        </div>
    </div>

    <!-- Projected directory pane -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <h3 class="text-sm font-semibold text-gray-700 mb-3">Projected (projected/)</h3>
        <div id="projected-tree"
             hx-get="/ui-api/files/tree?root=projected"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="text-gray-500 text-sm">Loading...</div>
        </div>
    </div>
</div>

<!-- File preview -->
<div id="file-preview" class="mt-6"></div>
{% endblock %}
