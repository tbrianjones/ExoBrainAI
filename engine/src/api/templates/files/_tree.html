<ul class="text-sm space-y-0.5">
    {% for entry in entries %}
    {% if entry.is_dir %}
    <li>
        <button type="button"
             class="flex items-center w-full text-left cursor-pointer hover:bg-gray-50 px-2 py-1 rounded"
             hx-get="/ui-api/files/tree?root={{ root }}&path={{ entry.rel_path }}"
             hx-target="next .subtree"
             hx-swap="innerHTML"
             hx-on::after-request="this.nextElementSibling.classList.remove('hidden')">
            <span class="text-gray-400 mr-2 text-xs">&#9654;</span>
            <span class="text-gray-700 font-medium">{{ entry.name }}/</span>
        </button>
        <div class="subtree hidden ml-4"></div>
    </li>
    {% else %}
    <li>
        <button type="button"
             class="flex items-center w-full text-left hover:bg-gray-50 px-2 py-1 rounded cursor-pointer"
             hx-get="/ui-api/files/preview?root={{ root }}&path={{ entry.rel_path }}"
             hx-target="#file-preview"
             hx-swap="innerHTML">
            <span class="text-gray-300 mr-2 text-xs">&#9679;</span>
            <span class="text-gray-600">{{ entry.name }}</span>
            <span class="ml-auto text-xs text-gray-400">{{ entry.size }}</span>
        </button>
    </li>
    {% endif %}
    {% else %}
    <li class="px-2 py-1 text-gray-400 text-xs">Empty directory</li>
    {% endfor %}
</ul>
