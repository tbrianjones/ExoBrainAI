{% extends "base.html" %}
{% block title %}Spaces Hierarchy ; ExoBrain{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-gray-900 mb-6">Spaces</h2>

<!-- Tab nav -->
<div class="border-b border-gray-200 mb-6">
    <nav class="flex gap-4">
        <a href="/ui/spaces" class="px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent hover:border-gray-300">List</a>
        <span class="px-3 py-2 text-sm font-medium text-blue-600 border-b-2 border-blue-600">Hierarchy</span>
    </nav>
</div>

<!-- Toolbar -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 flex items-center justify-between gap-4 p-4 mb-6">
    <input type="text" name="q" placeholder="Filter spaces..."
           class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
           hx-get="/ui-api/spaces/tree"
           hx-trigger="keyup changed delay:300ms"
           hx-target="#space-tree">
    <button id="collapse-toggle" onclick="toggleAllSpaces()"
            class="px-3 py-1.5 text-sm border border-gray-300 rounded hover:bg-gray-100">Expand All</button>
</div>

<!-- Space tree -->
<div id="space-tree"
     hx-get="/ui-api/spaces/tree"
     hx-trigger="load"
     hx-swap="innerHTML">
    Loading spaces...
</div>

<script>
function toggleSpace(btn) {
    var item = btn.closest('.space-tree-item');
    var children = item.querySelector(':scope > .space-tree-children');
    if (children) {
        var isCollapsed = children.style.display === 'none';
        children.style.display = isCollapsed ? '' : 'none';
        btn.textContent = isCollapsed ? '\u25bc' : '\u25b6';
    }
}
function toggleAllSpaces() {
    var btn = document.getElementById('collapse-toggle');
    var allChildren = document.querySelectorAll('.space-tree-children');
    var expanding = btn.textContent === 'Expand All';
    allChildren.forEach(function(el) {
        el.style.display = expanding ? '' : 'none';
    });
    document.querySelectorAll('.space-tree-toggle').forEach(function(t) {
        t.textContent = expanding ? '\u25bc' : '\u25b6';
    });
    btn.textContent = expanding ? 'Collapse All' : 'Expand All';
}
</script>
{% endblock %}
