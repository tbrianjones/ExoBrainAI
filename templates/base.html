<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Claude Writer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="nav-brand">Claude Writer</a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Ideas</a>
                <a href="{{ url_for('setup') }}">Setup</a>
            </div>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>Claude Writer helps you explore ideas and create content with Claude Code.</p>
        </div>
    </footer>
</body>
</html>
